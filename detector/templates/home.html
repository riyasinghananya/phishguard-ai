<!DOCTYPE html>
<html>

<head>
    <title>PHISHGUARD AI</title>

    <style>
        body {
            background: #0f172a;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        .container {
            width: 420px;
            background: #111827;
            padding: 30px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0px 0px 40px #00ffb3;
        }
        
        h1 {
            color: #00ffb3;
            font-size: 42px;
        }
        
        h3 {
            color: white;
            margin-top: -10px;
        }
        
        textarea {
            width: 100%;
            height: 120px;
            border: none;
            border-radius: 15px;
            padding: 15px;
            font-size: 16px;
            background: #d1d5db;
            margin-top: 20px;
        }
        
        button {
            margin-top: 20px;
            width: 200px;
            height: 50px;
            border: none;
            border-radius: 15px;
            background: #00ffb3;
            color: black;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0px 0px 20px #00ffb3;
        }
        
        .result {
            margin-top: 20px;
            font-size: 35px;
            color: white;
            font-weight: bold;
        }
        
        .score {
            margin-top: 10px;
            color: orange;
            font-size: 30px;
            font-weight: bold;
        }
        
        .bar {
            width: 100%;
            height: 25px;
            background: #1e293b;
            border-radius: 20px;
            margin-top: 20px;
        }
        
        .fill {
            height: 25px;
            background: red;
            border-radius: 20px;
            text-align: center;
            color: white;
            font-weight: bold;
        }
        
        .ai-box {
            margin-top: 20px;
            background: #0f172a;
            padding: 15px;
            border-radius: 15px;
        }
        
        .safe {
            color: #00ff99;
            font-size: 20px;
        }
        
        .danger {
            color: red;
            font-size: 20px;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>PHISHGUARD AI</h1>

        <h3>AI Powered Cyber Threat Detection Platform</h3>

        <form method="POST">

            {% csrf_token %}

            <textarea name="url" placeholder="Paste URL, email, OTP scam message or suspicious text here..."></textarea>

            <br>

            <button type="submit">
            Scan Threat
        </button>

        </form>

        <div class="result">
            {{ result }}
        </div>

        <div class="score">
            Threat Score: {{ score }}%
        </div>

        <div class="bar">

            <div class="fill" style="width:{{ score }}%;">
            </div>

        </div>

        <div class="ai-box">

            <h2 style="color:#00ffb3;">
                AI Analysis Report
            </h2>

            <p class="safe">
                ✅ Safe Probability:
                <b>{{ safe_score }}%</b>
            </p>

            <p class="danger">
                ⚠️ Phishing Probability:
                <b>{{ phishing_score }}%</b>
            </p>

        </div>

    </div>

</body>

</html>
